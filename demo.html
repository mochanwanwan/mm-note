<script>
(function(){
  var box = JSON.parse(document.getElementById('payload').textContent);
  var f = document.getElementById('f'), p = document.getElementById('p'),
      b = document.getElementById('b'), m = document.getElementById('m');

  if (!window.isSecureContext || !window.crypto || !crypto.subtle) {
    m.textContent = 'この画面は https でないと開けません。';
    b.disabled = true; return;
  }

  function bytes(s){
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }

  async function open_(phrase){
    var base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(phrase), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:bytes(box.salt), iterations:box.iter, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var gz = await crypto.subtle.decrypt({ name:'AES-GCM', iv:bytes(box.iv) }, key, bytes(box.data));
    var stream = new Response(gz).body.pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }

  f.addEventListener('submit', async function(e){
    e.preventDefault();
    b.disabled = true; m.textContent = 'ひらいています…';
    try {
      var html = await open_(p.value);
      document.open(); document.write(html); document.close();
    } catch (err) {
      // 鍵導出に数秒かかる端末があるので、待たされた末の失敗だと分かるように出す
      m.textContent = '合言葉が違うようです。';
      b.disabled = false; p.value = ''; p.focus();
    }
  });
  p.focus();
})();
</script>
